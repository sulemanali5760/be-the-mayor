# Automated acceptance run: headless Chrome (WebGL via SwiftShader) plays the first 15 minutes at desktop,
# small-window and phone sizes, offline (never the live Supabase), checks B1–B4 and keeps screenshots.
name: qa
on:
  push:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
concurrency: # a newer push to the same branch cancels the older run
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Serve the game
        run: python3 -m http.server 8080 &
      - run: node qa/acceptance.mjs http://localhost:8080/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots
          path: qa/out
