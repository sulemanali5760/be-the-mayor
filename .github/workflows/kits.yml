# Lane A: fetch the CC0 kits (tools/kits/kits.json), convert them with Blender, write assets/manifest.json and
# the contact sheets in docs/art/, validate, and commit the results back to the branch.
# Kit files are opened only on this runner, never on the dev laptop (LESSONS A1).
name: kits
on:
  push:
    paths: ['tools/kits/**', 'blender/**', 'assets/palette.json', '.github/workflows/kits.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kits-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kits:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the kits (checksums pinned in kits.json once known)
        run: |
          mkdir -p kits
          for k in $(jq -r '.kits | keys[]' tools/kits/kits.json); do
            url=$(jq -r --arg k "$k" '.kits[$k].url' tools/kits/kits.json)
            want=$(jq -r --arg k "$k" '.kits[$k].sha256 // ""' tools/kits/kits.json)
            curl -fsSL --retry 3 -o "kits/$k.zip" "$url"
            got=$(sha256sum "kits/$k.zip" | cut -d' ' -f1)
            echo "$k sha256 $got"
            if [ -n "$want" ] && [ "$want" != "$got" ]; then echo "::error::$k changed upstream: sha256 $got, pinned $want"; exit 1; fi
            unzip -q -o "kits/$k.zip" -d "kits/$k"
            echo "$k models:"; find "kits/$k" -iname '*.glb' -o -iname '*.gltf' | sed 's|.*/||' | sort -u | tr '\n' ' '; echo
          done
      - name: Install Blender 4.2 LTS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 > /dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
      - name: Convert, manifest, contact sheets
        run: ./blender-4.2.3-linux-x64/blender --background --factory-startup --python-exit-code 1 --python blender/kits.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate
        run: npm install --no-save gltf-validator && node tools/validate_assets.mjs --manifest
      - name: Commit the results
        run: |
          rm -rf blender-4.2.3-linux-x64 node_modules kits
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets docs/art
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Kits: converted models, manifest and contact sheets (CI)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
